name: Azure OIDC smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticate:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure session
        shell: bash
        run: az account show --query "{subscription:id,tenantId:tenantId}" --output none
