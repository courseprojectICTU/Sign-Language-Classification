name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and model
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium firefox

      - name: Run Ruff
        run: ruff check src tests scripts

      - name: Check formatting with Black
        run: black --check src tests scripts

      - name: Run tests
        run: pytest tests -v

  docker-build:
    name: Build Docker image without pushing
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and model
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Record build start time
        shell: bash
        run: |
          echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build Docker image with GHA cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: vsl-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}

      - name: Report build duration and image size
        shell: bash
        run: |
          BUILD_END=$(date +%s)
          BUILD_DURATION=$((BUILD_END - BUILD_START))
          IMAGE_SIZE_BYTES=$(docker image inspect vsl-api:ci --format='{{.Size}}')
          IMAGE_SIZE_MB=$((IMAGE_SIZE_BYTES / 1024 / 1024))

          echo "Docker build duration: ${BUILD_DURATION}s"
          echo "Docker image size: ${IMAGE_SIZE_MB} MiB (${IMAGE_SIZE_BYTES} bytes)"
          {
            echo "### Docker build metrics"
            echo "- Duration: ${BUILD_DURATION}s"
            echo "- Image size: ${IMAGE_SIZE_MB} MiB (${IMAGE_SIZE_BYTES} bytes)"
            echo "- Platform: linux/amd64"
            echo "- BuildKit cache: type=gha"
          } >> "$GITHUB_STEP_SUMMARY"
