name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest httpx
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Check code formatting (Black)
        run: |
          black --check src tests

      - name: Run Unit & Contract Tests
        run: |
          pytest tests/test_config.py \
                 tests/test_labels.py \
                 tests/test_heatmap.py \
                 tests/test_requirements.py \
                 tests/test_landmark_contract.py \
                 tests/test_cors_version.py \
                 tests/test_ops_contract.py \
                 tests/test_health.py \
                 tests/test_predict.py -v

  docker-build:
    name: Optimized Docker Build (No Push)
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Record start time
        run: echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

      - name: Build Docker Image with GHA Cache (US-038, TSK-073)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: vsl-api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record Image Size & Build Duration (US-038, TSK-074, AC-038-04)
        run: |
          BUILD_END=$(date +%s)
          DURATION=$((BUILD_END - BUILD_START))
          IMAGE_SIZE=$(docker image inspect vsl-api:ci-test --format='{{.Size}}')
          SIZE_MB=$((IMAGE_SIZE / 1024 / 1024))
          
          echo "=========================================================="
          echo "DOCKER BUILD METRICS (US-038 / EPC-03)"
          echo "Thoi gian build: ${DURATION} giay"
          echo "Kich thuoc Image: ${SIZE_MB} MB (${IMAGE_SIZE} bytes)"
          echo "=========================================================="
          
          echo "### 🐳 Docker Build Metrics (US-038)" >> $GITHUB_STEP_SUMMARY
          echo "- **Thoi gian build:** ${DURATION} giay" >> $GITHUB_STEP_SUMMARY
          echo "- **Kich thuoc Image:** ${SIZE_MB} MB" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform:** linux/amd64 (BR-025)" >> $GITHUB_STEP_SUMMARY
          echo "- **Cache status:** type=gha enabled" >> $GITHUB_STEP_SUMMARY

