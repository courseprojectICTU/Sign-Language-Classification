name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source and model
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Playwright browsers
        timeout-minutes: 15
        shell: bash
        run: |
          printf '%s\n' \
            'Acquire::ForceIPv4 "true";' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "15";' \
            'Acquire::https::Timeout "15";' \
            'Acquire::http::Pipeline-Depth "0";' \
            'Acquire::https::Pipeline-Depth "0";' | sudo tee /etc/apt/apt.conf.d/99ci-resilience >/dev/null

          python -m playwright install chromium firefox

          install_playwright() {
            timeout 180 python -m playwright install --with-deps chromium firefox
          }

          switch_apt_mirror() {
            local target_uri="$1"
            sudo pkill -x apt-get || true
            sleep 2
            sudo dpkg --configure -a || true
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf '%s\n' "${target_uri}" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i -E \
              "s#https?://[a-z0-9.-]+\.ubuntu\.com/ubuntu/?#${target_uri}#g" {} +
            sudo apt-get clean
            sudo apt-get -o DPkg::Lock::Timeout=30 update --fix-missing
          }

          if ! install_playwright; then
            echo "::warning::Default Ubuntu mirror failed during Playwright install; switching to archive.ubuntu.com..."
            switch_apt_mirror "http://archive.ubuntu.com/ubuntu/"
            if ! install_playwright; then
              echo "::warning::archive.ubuntu.com failed; switching to azure.archive.ubuntu.com..."
              switch_apt_mirror "http://azure.archive.ubuntu.com/ubuntu/"
              install_playwright
            fi
          fi

      - name: Run Ruff
        run: ruff check src tests scripts

      - name: Check formatting with Black
        run: black --check src tests scripts

      - name: Run tests
        run: pytest tests -v

  docker-build:
    name: Build Docker image without pushing
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source and model
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Record build start time
        shell: bash
        run: |
          echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build Docker image with GHA cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: vsl-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}

      - name: Report build duration and image size
        shell: bash
        run: |
          BUILD_END=$(date +%s)
          BUILD_DURATION=$((BUILD_END - BUILD_START))
          IMAGE_SIZE_BYTES=$(docker image inspect vsl-api:ci --format='{{.Size}}')
          IMAGE_SIZE_MB=$((IMAGE_SIZE_BYTES / 1024 / 1024))

          echo "Docker build duration: ${BUILD_DURATION}s"
          echo "Docker image size: ${IMAGE_SIZE_MB} MiB (${IMAGE_SIZE_BYTES} bytes)"
          {
            echo "### Docker build metrics"
            echo "- Duration: ${BUILD_DURATION}s"
            echo "- Image size: ${IMAGE_SIZE_MB} MiB (${IMAGE_SIZE_BYTES} bytes)"
            echo "- Platform: linux/amd64"
            echo "- BuildKit cache: type=gha"
          } >> "$GITHUB_STEP_SUMMARY"
